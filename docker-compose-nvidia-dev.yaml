version: '3.8'

services:
  # Pale Fire API with NVIDIA support
  palefire-api:
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    image: palefire-api:nvidia-dev
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - TORCH_CUDA_ARCH_LIST="5.0" # Explicitly target Maxwell architecture
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Configs from base compose
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=palefire123
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=deepseek-r1:7b
      - EMBEDDER_PROVIDER=ollama
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - NER_ENABLED=true
      - NER_USE_SPACY=true
      - SPACY_MODEL=en_core_web_sm
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - palefire-network
    command: python api.py

  # MCP Server with NVIDIA support
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    image: palefire-mcp:nvidia-dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - TORCH_CUDA_ARCH_LIST="5.0"
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Configs
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=palefire123
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=deepseek-r1:7b
      - EMBEDDER_PROVIDER=ollama
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - NER_ENABLED=true
      - NER_USE_SPACY=true
      - SPACY_MODEL=en_core_web_sm
      - LOG_LEVEL=WARNING
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - palefire-network
    stdin_open: true
    tty: false
    command: python mcp_server.py

  # CLI with NVIDIA support
  palefire-cli:
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    image: palefire-cli:nvidia-dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      - TORCH_CUDA_ARCH_LIST="5.0"
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Configs
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=palefire123
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=deepseek-r1:7b
      - EMBEDDER_PROVIDER=ollama
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - NER_ENABLED=true
      - NER_USE_SPACY=true
      - SPACY_MODEL=en_core_web_sm
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - palefire-network
    profiles:
      - cli
    command: tail -f /dev/null
